openapi: 3.0.3
info:
  title: Todo API
  version: 0.1.0
  description: Personal task management API, scoped to the signed-in caller.
servers:
  - url: /

paths:
  /tasks:
    get:
      operationId: listTasks
      summary: List the caller's tasks
      parameters:
        - name: completed
          in: query
          description: filter by completed state
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: page of tasks
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching tasks }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createTask
      summary: Add a new task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '201':
          description: task created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400':
          description: invalid task input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    patch:
      operationId: updateTask
      summary: Edit a task's text and/or completed state
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdate' }
      responses:
        '200':
          description: task updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400':
          description: invalid update input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: task not found for this caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteTask
      summary: Delete a task
      responses:
        '204':
          description: task deleted
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: task not found for this caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      description: id of the task
      schema: { type: string }

  schemas:
    Task:
      type: object
      required: [id, text, completed, createdAt, updatedAt]
      properties:
        id: { type: string }
        text: { type: string }
        completed: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
    TaskUpdate:
      type: object
      properties:
        text: { type: string, minLength: 1 }
        completed: { type: boolean }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }

  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

security:
  - bearerAuth: []
